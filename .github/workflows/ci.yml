name: CI

on:
  push:
    branches: [main]
    # A change to only these runs nothing: no test reads them, and each run asks for
    # four macOS runners, which GitHub sometimes can't find. README.md and CHANGELOG.md
    # aren't here because the tests and the package build read them.
    paths-ignore: ["docs/**", "plugin/README.md", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.svg", "**/*.webp"]
  pull_request:
    paths-ignore: ["docs/**", "plugin/README.md", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.svg", "**/*.webp"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and check the package
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - name: The built wheel installs and runs, MCP server included
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          /tmp/wheel/bin/slicerbridge printers -p u1
          /tmp/wheel/bin/python -c "import slicerbridge.mcp_server"

  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: The plugin's lock matches its pyproject
        run: uv lock --check --project plugin
      - name: The plugin's locked packages install and run, MCP server included
        run: |
          uv run --frozen --project plugin slicerbridge printers -p u1
          uv run --frozen --project plugin python -c "import slicerbridge.mcp_server"

