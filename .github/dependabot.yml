version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  # The Claude plugin's lock. SlicerBridge itself moves with `scripts/release.py plugin` after a release.
  - package-ecosystem: uv
    directory: /plugin
    schedule:
      interval: monthly
    ignore:
      - dependency-name: slicerbridge
